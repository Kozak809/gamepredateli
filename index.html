    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(to right, #74ebd5, #acb6e5);
            color: #333;
            text-align: center;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        h1 {
            font-size: 3em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            animation: fadeIn 1s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .hidden {
            display: none;
        }

        input {
            padding: 10px;
            margin: 10px 0;
            border: 2px solid #74ebd5;
            border-radius: 5px;
            transition: border-color 0.3s;
            width: 200px;
        }

        input:focus {
            border-color: #acb6e5;
            outline: none;
        }

        select,
        button {
            padding: 10px;
            margin: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.3s;
        }

        select {
            background-color: #ffffff;
            border: 2px solid #74ebd5;
        }

        button {
            background-color: #74ebd5;
            color: white;
            font-weight: bold;
        }

        button:hover {
            background-color: #acb6e5;
            transform: scale(1.05);
            box-shadow: 0 0 10px rgba(172, 182, 229, 0.7);
        }

        button:focus {
            outline: none;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
        }

        .game-status {
            margin-top: 20px;
            font-size: 1.5em;
            color: #333;
            animation: slideIn 1s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-20px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        #generatedCode {
            margin: 20px 0;
            font-size: 2.5em;
            font-weight: bold;
            color: #ffffff;
            animation: glow 1.2s infinite alternate;
        }

        @keyframes glow {
            0% {
                text-shadow: 0 0 10px rgba(255, 255, 255, 0.7);
            }

            100% {
                text-shadow: 0 0 20px rgba(172, 182, 229, 1);
            }
        }

        #assignedWords {
            margin: 20px 0;
            font-size: 1.8em;
            color: #333;
        }

        #toggleWordBtn {
            background: none;
            border: none;
            font-size: 1.2em;
            cursor: pointer;
            margin-left: 15px;
            padding: 5px;
            border-radius: 50%;
            transition: background-color 0.3s;
            vertical-align: middle;
        }

        #toggleWordBtn:hover {
            background-color: rgba(116, 235, 213, 0.3);
            transform: none;
            box-shadow: none;
        }

        #yourRoleIs {
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>

        function creategoBackBtn() {
            goBackBtn.id = 'goBackBtn';
            goBackBtn.textContent = 'Назад';
            document.body.appendChild(goBackBtn);
            goBackBtn.classList.remove('hidden');
        }

            initialMenu.classList.add('hidden');
            createGameMenu.classList.remove('hidden');
            creategoBackBtn();
        });

            initialMenu.classList.add('hidden');
            joinGameMenu.classList.remove('hidden');
            creategoBackBtn();
        });

        goBackBtn.addEventListener('click', function () {
            initialMenu.classList.remove('hidden');
            joinGameMenu.classList.add('hidden');
            createGameMenu.classList.add('hidden');
            gameRoom.classList.add('hidden');
            gameMenu.classList.add('hidden');
            yourRoleIs.classList.add('hidden');
            toggleWordBtn.classList.add('hidden');
            wordText.textContent = '';
            isWordVisible = true;
            currentWord = '';
            goBackBtn.remove();
        });

        function generateCode(players) {
            let code = '';
            let sum = 0;
            let attempts = 0;
            const maxAttempts = 1000;
            
            while (sum !== players && attempts < maxAttempts) {
                code = '';
                sum = 0;
                
                // Генерируем первые 3 символа случайно
                for (let i = 0; i < 3; i++) {
                    let char = chars[Math.floor(Math.random() * chars.length)];
                    code += char;
                    if (!isNaN(parseInt(char))) {
                        sum += parseInt(char);
                    }
                }
                
                // Четвертый символ подбираем для достижения нужной суммы
                let needed = players - sum;
                if (needed >= 0 && needed <= 9) {
                    code += needed.toString();
                    sum = players;
                } else {
                    // Если не можем подобрать цифру, добавляем случайную букву
                    let randomLetter = chars[Math.floor(Math.random() * (chars.length - 10)) + 10];
                    code += randomLetter;
                }
                
                attempts++;
            }
            
            // Если не удалось сгенерировать код с нужной суммой, используем простой метод
            if (sum !== players) {
                code = '';
                sum = 0;
                for (let i = 0; i < 3; i++) {
                    code += chars[Math.floor(Math.random() * (chars.length - 10)) + 10]; // только буквы
                }
                code += players.toString(); // последний символ - количество игроков
            }
            
            return code;
        }

        // Нажатие на "Создать комнату"
        createRoomBtn.addEventListener('click', function () {
            let players = parseInt(playersCount.value);
            let newcode = generateCode(players);
            generatedCode.textContent = `Код игры: ${newcode}`;
            createGameMenu.classList.add('hidden');
            // const playerWords = assignWordsToPlayers(players);
            // assignedWords.textContent = `Слова, выданные игрокам: ${playerWords.join(', ')}`;
            gameRoom.classList.remove('hidden');
            startGameMenu.addEventListener('click', function () {
                mainGame(newcode);
            });
        });
        submitGameCode.addEventListener('click', function () {
            let oldcode = gameCodeInput.value;
            mainGame(oldcode);
        });

        function convertStringToNumber(str) {
            let total = 0;

            for (let i = 0; i < str.length; i++) {
                let char = str[i];
                let index = chars.indexOf(char);
                total += index;
            }

            return total;
        }

        function mainGame(code) {
            initialMenu.classList.add('hidden');
            joinGameMenu.classList.add('hidden');
            createGameMenu.classList.add('hidden');
            gameRoom.classList.add('hidden');
            goBackBtn.classList.add('hidden');
            creategoBackBtn();
            let wordid = convertStringToNumber(code);
            let maxpl = 0;
            for (let i = 0; i < code.length; i++) {
                if (!isNaN(code[i])) { maxpl += parseInt(code[i]); }
            }
            gameMenu.classList.remove('hidden');
            // Устанавливаем максимальное значение для input
            playerNumber.setAttribute('max', maxpl);
            let curentMathia = convertStringToNumber(code) % maxpl+1;
            startGameBtn.addEventListener('click', function () {
                let curentPlayerNumber = playerNumber.value;
                if (curentPlayerNumber <= maxpl && curentPlayerNumber > 0) {
                    if (curentMathia == curentPlayerNumber) {
                        currentWord = wordPairs[wordid - 4][1];
                    } else {
                        currentWord = wordPairs[wordid - 4][0];
                    }
                    wordText.textContent = `Твоё слово: ${currentWord}`;
                    yourRoleIs.classList.remove('hidden');
                    toggleWordBtn.classList.remove('hidden');
                }
            })
        }

        toggleWordBtn.addEventListener('click', function () {
            if (isWordVisible) {
                wordText.textContent = 'Твоё слово: ****';
                toggleWordBtn.textContent = '👁️‍🗨️';
                isWordVisible = false;
            } else {
                wordText.textContent = `Твоё слово: ${currentWord}`;
                toggleWordBtn.textContent = '👁️';
                isWordVisible = true;
            }
        });
